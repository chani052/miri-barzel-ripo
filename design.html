<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>עיצוב חנוכייה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --sky-top: #26307e;
    --sky-mid: #121848;
    --sky-low: #0b0f30;
    --ink: #f3f4ff;
    --muted: #aeb3df;
    --faint: #7f86bf;
    --card: rgba(255, 255, 255, .055);
    --card-line: rgba(255, 255, 255, .11);
    --chip: rgba(255, 255, 255, .07);
    --gold: #ffc861;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --sky-top: #1c2468; --sky-mid: #0e1340; --sky-low: #080b26; }
  }
  :root[data-theme="dark"] { --sky-top: #1c2468; --sky-mid: #0e1340; --sky-low: #080b26; }

  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    color: var(--ink);
    font-family: "Rubik", "Segoe UI", Arial, sans-serif;
    line-height: 1.55;
    background: radial-gradient(120% 70% at 50% -10%, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-low) 100%) fixed;
    background-color: var(--sky-low);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .sky i { position: absolute; border-radius: 50%; background: #fff; animation: tw 3.5s ease-in-out infinite alternate; }
  @keyframes tw { from { opacity: .15; } to { opacity: .8; } }

  /* ---------- site nav (same block goes into index.html) ---------- */
  .site-nav {
    position: relative; z-index: 2;
    display: flex; justify-content: center; gap: 4px;
    width: max-content; max-width: calc(100% - 32px);
    margin: 16px auto 0; padding: 5px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .11);
  }
  .site-nav a {
    padding: 8px 16px; border-radius: 999px;
    color: #aeb3df; text-decoration: none; font-size: .95rem; font-weight: 500;
    white-space: nowrap;
  }
  .site-nav a:hover { color: #fff; }
  .site-nav a[aria-current="page"] { background: linear-gradient(180deg, #ffd780, #f0a23b); color: #2b1a04; }

  .wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 0 20px 40px; }

  .hero { text-align: center; padding: 28px 0 22px; }
  h1 {
    font-family: "Suez One", Georgia, serif; font-weight: 400;
    font-size: clamp(2.6rem, 7vw, 4.4rem); line-height: 1.05; margin: 0;
    background: linear-gradient(270deg, #ff7aa8 0%, #ffa24a 45%, #ffd75e 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 22px rgba(255, 170, 80, .35));
  }
  .lead { margin: 8px auto 0; color: var(--muted); max-width: 44ch; }

  .layout { display: grid; grid-template-columns: 1.45fr 1fr; gap: 18px; align-items: start; }
  .card { background: var(--card); border: 1px solid var(--card-line); border-radius: 26px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }

  .preview { position: relative; overflow: hidden; padding: 22px 18px 18px; position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); }
  .preview .glow {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(45% 50% at 50% 34%, rgba(255, 185, 90, .32), rgba(255, 140, 60, .08) 55%, transparent 75%);
    opacity: 0; transition: opacity 800ms ease;
  }
  .menorah { position: relative; display: block; width: 100%; height: auto; }
  .summary { position: relative; text-align: center; margin: 6px 0 14px; color: var(--muted); min-height: 1.6em; }
  .summary b { color: var(--ink); font-weight: 500; }
  .actions { position: relative; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }

  .flame { transform-box: fill-box; transform-origin: 50% 100%; transform: scale(0); opacity: 0; }
  .flame.on { animation: ignite 480ms cubic-bezier(.2, .9, .3, 1.35) forwards; }
  .flame.on .fb { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.7s ease-in-out infinite alternate; }
  .flame.on .halo { animation: pulse 2.4s ease-in-out infinite alternate; }
  @keyframes ignite { from { transform: scale(.1); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes flicker { 0% { transform: scale(1, 1) skewX(0); } 30% { transform: scale(.95, 1.06) skewX(-3deg); } 60% { transform: scale(1.04, .96) skewX(2deg); } 100% { transform: scale(.98, 1.03) skewX(-1deg); } }
  @keyframes pulse { from { opacity: .7; } to { opacity: 1; } }

  .panel { padding: 20px 20px 22px; }
  .group + .group { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--card-line); }
  .group h2 { font-family: "Suez One", Georgia, serif; font-weight: 400; font-size: 1.15rem; margin: 0 0 10px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt {
    display: inline-flex; align-items: center; gap: 8px;
    height: 40px; padding: 0 12px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--card-line); background: var(--chip); font-size: .92rem;
    transition: border-color 160ms ease, background 160ms ease;
  }
  .opt:hover { border-color: rgba(255, 200, 97, .55); }
  .opt[aria-pressed="true"] { border-color: var(--gold); background: rgba(255, 200, 97, .14); }
  .strip { display: inline-flex; height: 14px; border-radius: 4px; overflow: hidden; }
  .strip span { width: 6px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; }
  .nights { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .chip {
    height: 40px; border-radius: 10px; border: 1px solid var(--card-line); background: var(--chip); cursor: pointer;
    font-family: "Suez One", Georgia, serif; font-size: 1.05rem;
  }
  .chip[aria-pressed="true"] { background: linear-gradient(180deg, #ffd780, #f0a23b); color: #2b1a04; border-color: transparent; }

  .btn {
    height: 44px; padding: 0 20px; border-radius: 12px; border: 0; cursor: pointer; font-weight: 700;
    background: linear-gradient(180deg, #ffd780, #f0a23b); color: #2b1a04;
    box-shadow: 0 8px 22px -10px rgba(255, 175, 70, .9);
    transition: transform 140ms ease, filter 140ms ease;
  }
  .btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .btn:disabled { opacity: .5; cursor: default; transform: none; }
  .btn.ghost { background: var(--chip); color: var(--ink); border: 1px solid var(--card-line); box-shadow: none; font-weight: 500; }

  footer { text-align: center; color: var(--faint); margin-top: 28px; font-family: "Suez One", Georgia, serif; font-size: 1.1rem; }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .preview { position: relative; top: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sky i { animation: none; opacity: .5; }
    .flame.on { animation: none; transform: scale(1); opacity: 1; }
    .flame.on .fb, .flame.on .halo { animation: none; }
  }
</style>
</head>
<body>
<div class="sky" id="sky"></div>

<nav class="site-nav" aria-label="ניווט ראשי">
  <a href="index.html">אור של חנוכה</a>
  <a href="design.html" aria-current="page">עיצוב חנוכייה</a>
</nav>

<main class="wrap">
  <header class="hero">
    <h1>עצבו חנוכייה</h1>
    <p class="lead">בחרו צבעי נרות, חומר וצורת קנים, ואז הדליקו ותראו איך היא מאירה.</p>
  </header>

  <div class="layout">
    <section class="card preview" aria-label="תצוגה מקדימה">
      <div class="glow" id="glow"></div>
      <svg class="menorah" viewBox="0 28 560 332" role="img" aria-label="החנוכייה שעיצבתם">
        <defs>
          <linearGradient id="mV" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0"/><stop offset=".45"/><stop offset="1"/>
          </linearGradient>
          <linearGradient id="mH" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"/><stop offset=".4"/><stop offset=".6"/><stop offset="1"/>
          </linearGradient>
          <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#000" stop-opacity=".28"/>
            <stop offset=".35" stop-color="#fff" stop-opacity=".22"/>
            <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
            <stop offset="1" stop-color="#000" stop-opacity=".3"/>
          </linearGradient>
          <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#ff7417"/><stop offset=".5" stop-color="#ffb43a"/><stop offset="1" stop-color="#fff0b0"/>
          </linearGradient>
          <radialGradient id="haloG">
            <stop offset="0" stop-color="#ffd27a" stop-opacity=".8"/>
            <stop offset=".5" stop-color="#ffa63c" stop-opacity=".22"/>
            <stop offset="1" stop-color="#ff8a20" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="floor"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
          <g id="patterns"></g>
        </defs>
        <ellipse cx="280" cy="348" rx="120" ry="8" fill="url(#floor)"/>
        <g id="arms" fill="none" stroke="url(#mV)" stroke-width="5" stroke-linecap="round"></g>
        <rect x="273" y="236" width="14" height="96" rx="5" fill="url(#mH)"/>
        <ellipse cx="280" cy="272" rx="10" ry="8" fill="url(#mV)"/>
        <ellipse cx="280" cy="304" rx="8" ry="7" fill="url(#mV)"/>
        <path d="M218,343 Q280,306 342,343 Z" fill="url(#mV)"/>
        <rect x="206" y="340" width="148" height="9" rx="4.5" fill="url(#mH)"/>
        <rect x="40" y="232" width="480" height="12" rx="6" fill="url(#mV)"/>
        <rect x="276" y="170" width="8" height="64" rx="3" fill="url(#mH)"/>
        <g id="cups"></g>
        <g id="candles"></g>
      </svg>
      <p class="summary" id="summary" aria-live="polite"></p>
      <div class="actions">
        <button class="btn" id="lightBtn" type="button">הדלקה</button>
        <button class="btn ghost" id="outBtn" type="button">כיבוי</button>
        <button class="btn ghost" id="randomBtn" type="button">עיצוב מפתיע</button>
      </div>
    </section>

    <aside class="card panel" aria-label="אפשרויות עיצוב">
      <div class="group">
        <h2>צבע הנרות</h2>
        <div class="opts" id="paletteOpts" role="group" aria-label="צבע הנרות"></div>
      </div>
      <div class="group">
        <h2>חומר החנוכייה</h2>
        <div class="opts" id="metalOpts" role="group" aria-label="חומר החנוכייה"></div>
      </div>
      <div class="group">
        <h2>צורת הקנים</h2>
        <div class="opts" id="armOpts" role="group" aria-label="צורת הקנים"></div>
      </div>
      <div class="group">
        <h2>לילה</h2>
        <div class="nights" id="nights" role="group" aria-label="בחירת לילה"></div>
      </div>
    </aside>
  </div>

  <footer>חנוכה שמח ומואר</footer>
</main>

<script>
(function () {
  "use strict";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

  /* stars */
  var sky = document.getElementById("sky");
  for (var s = 0; s < 60; s++) {
    var st = document.createElement("i");
    var sz = Math.random() < .2 ? 3 : 2;
    st.style.cssText = "left:" + (Math.random() * 100) + "%;top:" + (Math.random() * 100) + "%;width:" + sz + "px;height:" + sz + "px;animation-delay:" + (Math.random() * 3.5).toFixed(2) + "s";
    sky.appendChild(st);
  }

  /* options */
  var PALETTES = {
    rainbow: { name: "צבעי קשת", colors: ["#ec4f9a", "#a259f0", "#4f7cf0", "#22b8cf", "#2fbf6a", "#f2c12e", "#f5862e", "#ee4b5b"], stripe: .38 },
    blue:    { name: "כחול ולבן", colors: ["#3d7bf0", "#f4f6ff", "#3d7bf0", "#f4f6ff", "#3d7bf0", "#f4f6ff", "#3d7bf0", "#f4f6ff"], stripe: .3 },
    pastel:  { name: "פסטל", colors: ["#f9a8d4", "#c4b5fd", "#93c5fd", "#99f6e4", "#bbf7d0", "#fde68a", "#fed7aa", "#fecaca"], stripe: .45 },
    gold:    { name: "זהב", colors: ["#e9b949", "#e9b949", "#e9b949", "#e9b949", "#e9b949", "#e9b949", "#e9b949", "#e9b949"], stripe: .35 },
    classic: { name: "לבן קלאסי", colors: ["#f7f1e3", "#f7f1e3", "#f7f1e3", "#f7f1e3", "#f7f1e3", "#f7f1e3", "#f7f1e3", "#f7f1e3"], stripe: 0 }
  };
  var METALS = {
    gold:   { name: "זהב", v: ["#fff0b8", "#f1b84e", "#a86a14"], h: ["#9a5f12", "#ffe39a", "#f3c065", "#9a5f12"], rim: "#ffe7a0" },
    silver: { name: "כסף", v: ["#ffffff", "#c3c9d6", "#6f7788"], h: ["#626a7a", "#f4f6fb", "#c9cfda", "#626a7a"], rim: "#f2f4f8" },
    copper: { name: "נחושת", v: ["#ffd9bd", "#d0784a", "#7c3a1a"], h: ["#6e3015", "#ffc9a3", "#d98a5e", "#6e3015"], rim: "#ffd0ae" }
  };
  var ARMS = { round: "מעוגלים", diagonal: "אלכסוניים", none: "בלי קנים" };
  var ORD = ["א׳", "ב׳", "ג׳", "ד׳", "ה׳", "ו׳", "ז׳", "ח׳"];
  var state = { palette: "rainbow", metal: "gold", arms: "round", night: 8 };

  /* menorah build */
  var SLOTS = [60, 115, 170, 225, 335, 390, 445, 500], SH = 280;
  var patterns = document.getElementById("patterns");
  var stripeRects = [], baseRects = [];
  SLOTS.forEach(function (x, i) {
    var p = el("pattern", { id: "st" + i, width: 9, height: 9, patternUnits: "userSpaceOnUse", patternTransform: "rotate(-35)" }, patterns);
    baseRects.push(el("rect", { width: 9, height: 9 }, p));
    stripeRects.push(el("rect", { width: 3.5, height: 9 }, p));
  });

  var cups = document.getElementById("cups"), rims = [];
  function cup(x, top) {
    el("path", { d: "M" + (x - 14) + "," + top + " L" + (x + 14) + "," + top + " Q" + (x + 12) + "," + (top + 12) + " " + x + "," + (top + 12) + " Q" + (x - 12) + "," + (top + 12) + " " + (x - 14) + "," + top + " Z", fill: "url(#mV)" }, cups);
    rims.push(el("ellipse", { cx: x, cy: top, rx: 14, ry: 3 }, cups));
  }
  SLOTS.forEach(function (x) { cup(x, 222); });
  cup(SH, 160);

  var candlesG = document.getElementById("candles");
  function candle(x, top, h, fill) {
    var g = el("g", {}, candlesG);
    el("rect", { x: x - 7, y: top, width: 14, height: h, rx: 2, fill: fill }, g);
    el("rect", { x: x - 7, y: top, width: 14, height: h, rx: 2, fill: "url(#shade)" }, g);
    el("ellipse", { cx: x, cy: top, rx: 7, ry: 2.2, fill: "rgba(255,255,255,.55)" }, g);
    el("line", { x1: x, y1: top, x2: x, y2: top - 6, stroke: "#2a2018", "stroke-width": 1.8, "stroke-linecap": "round" }, g);
    var fl = el("g", { class: "flame" }, g);
    el("circle", { class: "halo", cx: x, cy: top - 18, r: 30, fill: "url(#haloG)" }, fl);
    var b = el("g", { class: "fb" }, fl);
    el("path", { d: "M" + x + "," + (top - 34) + " C" + (x + 8) + "," + (top - 22) + " " + (x + 9) + "," + (top - 12) + " " + (x + 6) + "," + (top - 6) + " C" + (x + 3) + "," + (top - 1) + " " + (x - 3) + "," + (top - 1) + " " + (x - 6) + "," + (top - 6) + " C" + (x - 9) + "," + (top - 12) + " " + (x - 8) + "," + (top - 22) + " " + x + "," + (top - 34) + " Z", fill: "url(#fire)" }, b);
    el("path", { d: "M" + x + "," + (top - 19) + " C" + (x + 3.5) + "," + (top - 13) + " " + (x + 4) + "," + (top - 8) + " " + (x + 2.5) + "," + (top - 5) + " C" + (x + 1) + "," + (top - 3) + " " + (x - 1) + "," + (top - 3) + " " + (x - 2.5) + "," + (top - 5) + " C" + (x - 4) + "," + (top - 8) + " " + (x - 3.5) + "," + (top - 13) + " " + x + "," + (top - 19) + " Z", fill: "#fffbe6" }, b);
    return fl;
  }
  var shamash = candle(SH, 92, 68, "#fbf3df");
  var flames = SLOTS.map(function (x, i) { return candle(x, 152, 70, "url(#st" + i + ")"); });

  var armsG = document.getElementById("arms");
  function drawArms() {
    armsG.innerHTML = "";
    [55, 110, 165, 220].forEach(function (d) {
      if (state.arms === "round") {
        el("path", { d: "M" + (SH - d) + ",244 Q" + SH + "," + (244 + d * .62) + " " + (SH + d) + ",244" }, armsG);
      } else if (state.arms === "diagonal") {
        var y = 250 + d * .22;
        el("path", { d: "M" + (SH - d) + ",244 L" + SH + "," + y + " L" + (SH + d) + ",244" }, armsG);
      }
    });
  }

  function applyPalette() {
    var p = PALETTES[state.palette];
    p.colors.forEach(function (c, i) {
      baseRects[i].setAttribute("fill", c);
      stripeRects[i].setAttribute("fill", "rgba(255,255,255," + p.stripe + ")");
    });
  }
  function applyMetal() {
    var m = METALS[state.metal];
    document.querySelectorAll("#mV stop").forEach(function (s, i) { s.setAttribute("stop-color", m.v[i]); });
    document.querySelectorAll("#mH stop").forEach(function (s, i) { s.setAttribute("stop-color", m.h[i]); });
    rims.forEach(function (r) { r.setAttribute("fill", m.rim); });
  }

  var summary = document.getElementById("summary");
  function updateSummary() {
    summary.innerHTML = "חנוכייה מ<b>" + METALS[state.metal].name + "</b>, נרות ב<b>" + PALETTES[state.palette].name + "</b>, לילה <b>" + ORD[state.night - 1] + "</b>";
  }

  /* lighting: candles left to right, shamash last */
  var glow = document.getElementById("glow");
  var lightBtn = document.getElementById("lightBtn");
  var timers = [], litCount = 0;
  function setGlow() { glow.style.opacity = litCount ? Math.min(1, .2 + litCount * .1) : 0; }
  function extinguish() {
    timers.forEach(clearTimeout); timers = [];
    flames.concat([shamash]).forEach(function (f) { f.classList.remove("on"); });
    litCount = 0; setGlow(); lightBtn.disabled = false;
  }
  function lightUp() {
    extinguish();
    lightBtn.disabled = true;
    var seq = flames.slice(8 - state.night).concat([shamash]);
    var gap = reduce ? 0 : 400;
    seq.forEach(function (f, i) {
      timers.push(setTimeout(function () {
        f.classList.add("on"); litCount++; setGlow();
        if (i === seq.length - 1) lightBtn.disabled = false;
      }, 120 + i * gap));
    });
  }

  /* option buttons */
  function makeGroup(containerId, items, key, render, onPick) {
    var box = document.getElementById(containerId);
    Object.keys(items).forEach(function (id) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "opt";
      b.dataset.id = id;
      b.innerHTML = render(id, items[id]);
      b.addEventListener("click", function () { state[key] = id; sync(); if (onPick) onPick(); });
      box.appendChild(b);
    });
  }
  makeGroup("paletteOpts", PALETTES, "palette", function (id, p) {
    var strip = '<span class="strip">' + p.colors.slice(0, 6).map(function (c) { return '<span style="background:' + c + '"></span>'; }).join("") + "</span>";
    return strip + p.name;
  });
  makeGroup("metalOpts", METALS, "metal", function (id, m) {
    return '<span class="dot" style="background:radial-gradient(circle at 35% 30%,' + m.v[0] + "," + m.v[1] + " 55%," + m.v[2] + ')"></span>' + m.name;
  });
  makeGroup("armOpts", ARMS, "arms", function (id, name) { return name; });

  var nightsEl = document.getElementById("nights");
  ORD.forEach(function (o, i) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = o;
    b.setAttribute("aria-label", "לילה " + o);
    b.addEventListener("click", function () { state.night = i + 1; sync(); lightUp(); });
    nightsEl.appendChild(b);
  });

  function markPressed(boxId, value) {
    Array.prototype.forEach.call(document.getElementById(boxId).children, function (b) {
      b.setAttribute("aria-pressed", b.dataset.id === value ? "true" : "false");
    });
  }
  function sync() {
    applyPalette(); applyMetal(); drawArms(); updateSummary();
    markPressed("paletteOpts", state.palette);
    markPressed("metalOpts", state.metal);
    markPressed("armOpts", state.arms);
    Array.prototype.forEach.call(nightsEl.children, function (b, i) {
      b.setAttribute("aria-pressed", i === state.night - 1 ? "true" : "false");
    });
  }

  lightBtn.addEventListener("click", lightUp);
  document.getElementById("outBtn").addEventListener("click", extinguish);
  document.getElementById("randomBtn").addEventListener("click", function () {
    state.palette = pick(Object.keys(PALETTES));
    state.metal = pick(Object.keys(METALS));
    state.arms = pick(Object.keys(ARMS));
    sync(); lightUp();
  });

  sync();
  setTimeout(lightUp, reduce ? 0 : 500);
})();
</script>
</body>
</html>
